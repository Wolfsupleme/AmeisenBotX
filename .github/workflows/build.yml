name: Compilar AmeisenBotX

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Mostrar entorno (para diagnostico)
        run: |
          dotnet --list-sdks
          where.exe link.exe

      - name: Restaurar paquetes
        run: dotnet restore .\AmeisenBotX\AmeisenBotX.csproj

      - name: Compilar (Release, x86 + implant AOT)
        run: dotnet build .\AmeisenBotX\AmeisenBotX.csproj -c Release --no-restore

      - name: Subir el binario compilado
        uses: actions/upload-artifact@v4
        with:
          name: AmeisenBotX-Release
          path: build/Release/**
          if-no-files-found: error
